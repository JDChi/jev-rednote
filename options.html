<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>小红书评论过滤设置</title>
    <link rel="stylesheet" href="options.css">
    <script src="options.js" defer></script>
  </head>
  <body>
    <main>
      <h1>小红书评论过滤</h1>
      <p class="intro">使用 Jev 识别评论里的推广引流和点点互动请求。</p>
      <form id="settings">
        <div class="field">
          <label for="api-key">TypeSafe API Key</label>
          <input id="api-key" type="password" spellcheck="false" autocapitalize="off"
                 aria-describedby="key-help feedback" disabled>
          <p id="key-help">Key 保存在这台电脑的扩展设置中。<a href="https://console.typesafe.ai/settings/keys"
             target="_blank" rel="noopener">在 TypeSafe 创建 Key</a></p>
        </div>
        <div class="field">
          <label class="checkbox">
            <input id="enabled" type="checkbox" aria-describedby="sharing" disabled>
            打开笔记时自动分析评论
          </label>
          <p id="sharing">开启后，扩展会将已加载的主评论正文和笔记标题发送给 TypeSafe。调用会计入你的 API 用量。</p>
        </div>
        <div class="field">
          <label class="checkbox">
            <input id="hide-matched-comments" type="checkbox" aria-describedby="hide-help" disabled>
            隐藏整条命中评论
          </label>
          <p id="hide-help">高分命中的主评论和整串回复会一起隐藏。Chrome 会在小红书标签页显示调试提示。主评论最多额外等待 2 秒，尚未判完的会显示原文。</p>
        </div>
        <div class="actions">
          <button type="submit" disabled>保存设置</button>
          <p id="feedback" role="status"></p>
        </div>
      </form>
    </main>
  </body>
</html>
